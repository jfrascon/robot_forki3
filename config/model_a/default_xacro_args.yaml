# Default Xacro arguments for the Forki3 model A.
# Runtime arguments such as namespace, robot_name, and sim_file are provided by launch files.

body_use_visual: "True"
body_use_collision: "True"
body_use_inertial: "False"
body_color: ""
s_wheel_front_use_visual: "True"
s_wheel_left_use_visual: "True"
s_wheel_right_use_visual: "True"
s_wheel_use_inertial: "True"
s_wheel_color: "0.0 0.0 0.0 1.0"
fork_use_visual: "True"
fork_use_collision: "True"
fork_color: ""
front_top_lidar_use_visual: "True"
front_top_lidar_use_collision: "True"
front_top_lidar_use_inertial: "True"
front_top_lidar_use_v_mesh: "True"
front_top_lidar_v_mesh_use_low_res: "True"
front_top_lidar_color: ""
front_top_lidar_use_c_mesh: "True"
front_top_lidar_c_mesh_use_low_res: "True"
# Positive pitch tilts the lidar 30 degrees toward the ground on the robot's +X side.
# Restore the commented level pose to compare ground coverage with the original mount.
# front_top_lidar_mount: "-0.07647355 0 1.786 0 0 0"
front_top_lidar_mount: "-0.07647355 0 1.786 0 0.5235987755982988 0"
back_bottom_lidar_use_visual: "True"
back_bottom_lidar_use_collision: "True"
back_bottom_lidar_use_inertial: "True"
back_bottom_lidar_use_v_mesh: "True"
back_bottom_lidar_color: ""
back_bottom_lidar_use_c_mesh: "True"
back_bottom_lidar_mount: "-0.692435 0 0.019941 0 0 3.141592653589793"
fork_rgbd_use_visual: "True"
fork_rgbd_use_collision: "True"
fork_rgbd_use_inertial: "True"
fork_rgbd_use_v_mesh: "True"
fork_rgbd_color: "0.5 0.5 0.5 1.0"
fork_rgbd_use_c_mesh: "False"
